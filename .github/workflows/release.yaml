name: "Release"
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yaml
      - sqlite-dist.toml
      - VERSION
      - setup.py
      - pyproject.toml
      - MANIFEST.in
      - bindings/python/**
      - bindings/rust/**
      - scripts/scope_npm.py
      - scripts/vendor.sh
      - tests/python-packaging.py
      - tests/npm-packaging.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GAR_PROJECT: gen-lang-client-0026636413
  GAR_LOCATION: us-east4
  NPM_SCOPE: "@cercova-studios"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(cat VERSION)
          case "$version" in
            *-alpha*) channel=alpha ;;
            *-beta*) channel=beta ;;
            *-rc*) channel=rc ;;
            *-*) echo "::error::unknown pre-release label in VERSION $version"; exit 1 ;;
            *) channel=latest ;;
          esac
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' bindings/rust/Cargo.toml | head -1)
          if [ "$crate" != "$version" ]; then
            echo "::error::bindings/rust/Cargo.toml version $crate does not match VERSION $version"
            exit 1
          fi
          if [ "$EVENT" = release ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "::error::release tag $TAG does not match VERSION (expected v$version)"
              exit 1
            fi
            expected=$([ "$channel" = latest ] && echo false || echo true)
            if [ "$RELEASE_PRERELEASE" != "$expected" ]; then
              echo "::error::release pre-release flag is $RELEASE_PRERELEASE but VERSION $version needs $expected"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sqlite-vec $version ($channel), publish=$([ "$EVENT" = release ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - run: make loadable static
      - uses: actions/upload-artifact@v7
        with:
          name: ext-${{ matrix.name }}
          path: dist/*

  windows:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/vendor.sh
        shell: bash
      - run: make sqlite-vec.h
      - run: mkdir dist
      - run: cl.exe /fPIC -shared /W4 /Ivendor/ /O2 /LD sqlite-vec.c -o dist/vec0.dll
      - uses: actions/upload-artifact@v7
        with:
          name: ext-windows-x86_64
          path: dist/*

  android:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platforms:
          - { name: android-aarch64, cc: aarch64-linux-android21-clang }
          - { name: android-i686, cc: i686-linux-android21-clang }
          - { name: android-x86_64, cc: x86_64-linux-android21-clang }
          - { name: android-armv7a, cc: armv7a-linux-androideabi21-clang }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./scripts/vendor.sh
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: android-actions/setup-android@v4
      - run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - env:
          CC: ${{ matrix.platforms.cc }}
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make CC="$CC" AR=llvm-ar RANLIB=llvm-ranlib STRIP=llvm-strip loadable
      - uses: actions/upload-artifact@v7
        with:
          name: ext-${{ matrix.platforms.name }}
          path: dist/*.so

  ios:
    needs: plan
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platforms:
          - { name: ios-aarch64, target: arm64-apple-ios, sdk: iphoneos }
          - { name: iossimulator-aarch64, target: arm64-apple-ios-simulator, sdk: iphonesimulator }
          - { name: iossimulator-x86_64, target: x86_64-apple-ios-simulator, sdk: iphonesimulator }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: ./scripts/vendor.sh
      - env:
          TARGET: ${{ matrix.platforms.target }}
          SDK: ${{ matrix.platforms.sdk }}
        run: make CFLAGS="-target $TARGET -isysroot $(xcrun -sdk "$SDK" --show-sdk-path) -fembed-bitcode -DNDEBUG=1" loadable static
      - uses: actions/upload-artifact@v7
        with:
          name: ext-${{ matrix.platforms.name }}
          path: dist/*

  wasm:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: "latest"
      - run: ./scripts/vendor.sh
      - run: make sqlite-vec.h
      - run: make wasm
      - uses: actions/upload-artifact@v7
        with:
          name: ext-wasm32-emscripten
          path: dist/.wasm/*
          include-hidden-files: true

  cosmopolitan:
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          COSMO_VERSION: "3.5.4"
        run: |
          mkdir "$HOME/cosmo"
          curl -fsSL -o "cosmocc-$COSMO_VERSION.zip" "https://github.com/jart/cosmopolitan/releases/download/$COSMO_VERSION/cosmocc-$COSMO_VERSION.zip"
          unzip -q "cosmocc-$COSMO_VERSION.zip" -d "$HOME/cosmo"
      - run: ./scripts/vendor.sh
      - run: make cli CC="$HOME/cosmo/bin/cosmocc" AR="$HOME/cosmo/bin/cosmoar" OMIT_SIMD=1
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: tar -czf "sqlite-vec-$VERSION-cli-cosmopolitan.tar.gz" dist/sqlite3
      - uses: actions/upload-artifact@v7
        with:
          name: cli-cosmopolitan
          path: sqlite-vec-*-cli-cosmopolitan.tar.gz

  python-wheels:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-aarch64, runner: macos-15 }
          - { name: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: native
          CIBW_SKIP: "*-musllinux_*"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
        run: uvx cibuildwheel==4.3.5 --output-dir wheelhouse
      - run: |
          uv venv --managed-python --python 3.13 .probe
          python=.probe/bin/python
          [ "$RUNNER_OS" = Windows ] && python=.probe/Scripts/python.exe
          uv pip install --python "$python" wheelhouse/*.whl
          "$python" -I tests/python-packaging.py --probe-installed
      - uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.name }}
          path: wheelhouse/*.whl

  python-sdist:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --sdist --out-dir sdist
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: sdist/*.tar.gz

  package:
    needs: [plan, native, windows, android, ios, wasm, cosmopolitan, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ext-*
          path: ext
      - run: |
          mkdir -p dist
          for dir in ext/ext-*; do mv "$dir" "dist/${dir#ext/ext-}"; done
          ls dist
      - run: make sqlite-vec.h
      - uses: asg017/setup-sqlite-dist@main
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: sqlite-dist build --set-version "$VERSION"
      - run: python3 scripts/scope_npm.py .sqlite-dist/npm release/npm --scope "$NPM_SCOPE"
      - run: python3 tests/npm-packaging.py -v
      - name: Resolve the scoped npm package on linux-x64
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          main=$(ls ../release/npm/*-sqlite-vec.tgz)
          platform=$(ls ../release/npm/*-sqlite-vec-linux-x64.tgz)
          npm install --offline --omit=optional --no-audit --no-fund "$main" "$platform"
          node -e "const p=require('$NPM_SCOPE/sqlite-vec').getLoadablePath(); if(!require('fs').existsSync(p)) process.exit(1); console.log(p)"
          node --input-type=module -e "import {getLoadablePath} from '$NPM_SCOPE/sqlite-vec'; import {existsSync} from 'node:fs'; if(!existsSync(getLoadablePath())) process.exit(1)"
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: release/python
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: cli-cosmopolitan
          path: release/assets
      - run: |
          cp .sqlite-dist/amalgamation/* .sqlite-dist/github_releases/* .sqlite-dist/spm/* \
             .sqlite-dist/sqlpkg/* .sqlite-dist/checksums.txt \
             .sqlite-dist/sqlite-dist-manifest.json .sqlite-dist/install.sh \
             release/python/* release/assets/
          (cd release && find . -type f | sort) >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release

  publish:
    if: github.event_name == 'release'
    needs: [plan, package]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ github.ref_name }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - run: gh release upload "$TAG" release/assets/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: astral-sh/setup-uv@v10.3.3
      - env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp.outputs.access_token }}
        run: |
          base="https://$GAR_LOCATION-python.pkg.dev/$GAR_PROJECT/sqlite-vec-python"
          uv publish --publish-url "$base/" --check-url "$base/simple/" release/python/*
      - env:
          NPM_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          registry="https://$GAR_LOCATION-npm.pkg.dev/$GAR_PROJECT/sqlite-vec-npm/"
          {
            echo "$NPM_SCOPE:registry=$registry"
            echo "//${registry#https://}:_authToken=\${NPM_TOKEN}"
          } > "$RUNNER_TEMP/.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          main=$(ls release/npm/*-sqlite-vec.tgz)
          for tarball in $(ls release/npm/*.tgz | grep -vx "$main") "$main"; do
            spec=$(tar -xzOf "$tarball" package/package.json | node -p "const m=JSON.parse(require('fs').readFileSync(0)); m.name+'@'+m.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "skip $spec (already published)"
            else
              npm publish "$tarball" --tag "$CHANNEL"
            fi
          done
