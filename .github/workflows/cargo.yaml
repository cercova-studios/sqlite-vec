name: Rust package
on:
  push:
    branches: [main, codex/dev-local-datastore]
  pull_request:
    branches: [main, codex/dev-local-datastore]
permissions:
  contents: read
concurrency:
  group: cargo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cargo-compatibility:
    name: Cargo and 0.1.9 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Fetch SQLite headers for freshness checks
        run: bash scripts/vendor.sh
      - name: Cache locked registry inputs
        run: |
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/rust-compat/Cargo.toml
      - name: Check package freshness, bundled SQLite and 0.1.9 interchange
        run: make test-rust-packaging
