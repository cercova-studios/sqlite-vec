[package]
name = "sqlite-vec"
version = "0.1.10-alpha.4"
edition = "2021"
authors = ["Alex Garcia <alexsebastian.garcia@gmail.com>"]
description = "FFI bindings to the sqlite-vec SQLite extension"
homepage = "https://github.com/cercova-studios/sqlite-vec"
repository = "https://github.com/cercova-studios/sqlite-vec"
keywords = ["sqlite", "sqlite-extension"]
license = "MIT OR Apache-2.0"
include = ["src/**", "build.rs", "sqlite-vec.c", "sqlite-vec.h", "sqlite3.h", "sqlite3ext.h", "LICENSE-*", "README.md"]

[build-dependencies]
cc = "1.0"

[dev-dependencies]
rusqlite = "0.31.0"
